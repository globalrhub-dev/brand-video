  <script>
    (function () {
      // seeded PRNG so the paper is identical on every frame and every render
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

      const c = document.getElementById("t-paper"), x = c.getContext("2d");
      x.fillStyle = "#ffffff"; x.fillRect(0, 0, 1920, 1080);
      // tooth: low-contrast mottling
      for (let i = 0; i < 2600; i++) {
        const px = R() * 1920, py = R() * 1080, r = 6 + R() * 26;
        x.fillStyle = `rgba(120,112,150,${0.003 + R() * 0.006})`;

      }
      // film grain tile
      const g = document.createElement("canvas"); g.width = g.height = 256;
      const gx = g.getContext("2d"), img = gx.createImageData(256, 256);
      for (let i = 0; i < img.data.length; i += 4) { const v = 255 - Math.floor(R() * R() * 70); img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
      gx.putImageData(img, 0, 0);
      document.getElementById("t-grain").style.background = `url(${g.toDataURL()}) repeat`;
      window.__timelines = window.__timelines || {};
