  <script>
    (function () {
      const D = 7.1;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f6-pg", { y: 1080 }, { y: 0, duration: 0.6, ease: "power2.inOut" }, 0);
      tl.to("#f6-pg", { y: -1080, duration: 0.6, ease: "power2.inOut" }, D - 0.6);
      const root = document.querySelector('[data-composition-id="s6"]');
      const NS = "http://www.w3.org/2000/svg";
      const CX = 960, CY = 610, R = 285, LAT0 = (24 * Math.PI) / 180;
      const rad = (d) => (d * Math.PI) / 180;
      // orthographic projection of the sketched globe
      const proj = (lat, lon, lon0) => {
        const la = rad(lat), dl = rad(lon - lon0);
        const x = Math.cos(la) * Math.sin(dl);
        const y = Math.sin(la) * Math.cos(LAT0) - Math.cos(la) * Math.sin(LAT0) * Math.cos(dl);
        const z = Math.sin(la) * Math.sin(LAT0) + Math.cos(la) * Math.cos(LAT0) * Math.cos(dl);
        return [CX + R * x, CY - R * y, z];
      };
      const linesAt = (lon0) => {
        let d = "";
        const run = (pts) => { let pen = false; for (const [x, y, z] of pts) { if (z > 0.02) { d += (pen ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); pen = true; } else pen = false; } };
        for (let m = -180; m < 180; m += 30) { const p = []; for (let la = -88; la <= 88; la += 4) p.push(proj(la, m, lon0)); run(p); }
        for (const la of [-60, -30, 0, 30, 60]) { const p = []; for (let lo = -180; lo <= 180; lo += 4) p.push(proj(la, lo, lon0)); run(p); }
        return d;
      };
      // rings radiating from the globe (static backdrop)
      const rings = root.querySelector("#f6-rings");
      [360, 450, 545, 645, 750].forEach((r, i) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", CX); c.setAttribute("cy", CY); c.setAttribute("r", r); c.setAttribute("fill", "none"); c.setAttribute("stroke", "#5A50B4"); c.setAttribute("stroke-width", i % 2 ? 2 : 3); if (i % 2) c.setAttribute("stroke-dasharray", "4 14"); rings.appendChild(c); });
      const LON = -96;
      // real university locations: Colorado State, Texas Tech, USF, Arkansas, USF
      const uni = [[40.57, -105.08], [33.58, -101.87], [28.06, -82.41], [36.07, -94.17], [28.06, -82.41]];
      const pinG = root.querySelector("#f6-pins"), strG = root.querySelector("#f6-strings");
      const cardPos = [[90, 500], [370, 640], [1600, 260], [1300, 210], [1450, 660]];
      const pins = [], strings = [];
      uni.forEach(([la, lo], i) => {
        const [x, y] = proj(la, lo, LON);
        if (i !== 4) { const g = document.createElementNS(NS, "g"); g.setAttribute("id", "f6-pin" + i); g.innerHTML = `<circle cx="${x}" cy="${y}" r="13" fill="#FFAA3E" stroke="#1F1A47" stroke-width="4"/><circle cx="${x}" cy="${y}" r="4" fill="#1F1A47"/>`; pinG.appendChild(g); pins.push(g); }
        const [cl, ct] = cardPos[i];
        const ex = cl + 125, ey = ct;                              // the card's tack
        const mx = (x + ex) / 2, my = Math.max(y, ey) + 30;   // strings hang, clear of the caption
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", `M ${x.toFixed(1)} ${y.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${ex} ${ey}`);
        p.setAttribute("fill", "none"); p.setAttribute("stroke", "#FFAA3E"); p.setAttribute("stroke-width", "4"); p.setAttribute("stroke-linecap", "round");
        strG.appendChild(p); strings.push(p);
      });
      const mer = root.querySelector("#f6-mer");
      const cards = ["#f6-c1", "#f6-c2", "#f6-c3", "#f6-c4", "#f6-c5"];
      const tilt = [-4, 3, 4, -2.5, -3];

      // ---- phase A: the globe spins to the faculty, pins drop, strings carry their cards out ----
      tl.fromTo("#f6-capA .w", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.14 }, 0.45);
      tl.fromTo(["#f6-chipA", "#f6-chipA2"], { scale: 0, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.36, ease: "back.out(1.8)", stagger: 0.12 }, 0.75);
      tl.fromTo("#f6-subA", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 1.1);
      tl.fromTo("#f6-rings", { opacity: 0, scale: 0.7, transformOrigin: "960px 610px" }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, 0.35);
      tl.fromTo("#f6-g", { scale: 0.3, opacity: 0, transformOrigin: "960px 610px" }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.5)" }, 0.4);
      const easeO = gsap.parseEase("power3.out");
      for (let k = 0; k <= 36; k++) tl.set(mer, { attr: { d: linesAt(-170 + 74 * easeO(k / 36)) } }, 0.4 + k * (1.3 / 36));
      tl.fromTo(pins, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2.5)", stagger: 0.07 }, 1.72);
      strings.forEach((p, i) => { const L = p.getTotalLength(); tl.set(p, { opacity: 0 }, 0); tl.set(p, { opacity: 1 }, 1.85 + i * 0.07); tl.fromTo(p, { strokeDasharray: `${L} ${L}`, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, 1.85 + i * 0.07); tl.set(p, { strokeDasharray: "3 13" }, 2.4 + i * 0.07); });
      cards.forEach((c, i) => { tl.fromTo(c, { scale: 0.2, opacity: 0, rotation: tilt[i] * 4 }, { scale: 1, opacity: 1, rotation: tilt[i], duration: 0.45, ease: "back.out(1.6)" }, 2.0 + i * 0.08); });

      // ---- phase B: globe and strings drop away, cards step back into a row; the letter rises ----
      tl.to("#f6-A", { y: -40, opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.35);
      tl.to(["#f6-strings", "#f6-rings"], { opacity: 0, duration: 0.25 }, 3.35);
      tl.to("#f6-g", { y: 760, duration: 0.55, ease: "power3.in" }, 3.35);
      cards.forEach((c, i) => {
        const [cl, ct] = cardPos[i];
        tl.to(c, { x: 40 + 160 * i - cl, y: 830 - ct, rotation: 0, scale: 0.6, transformOrigin: "0% 0%", duration: 0.6, ease: "power3.inOut" }, 3.4 + i * 0.03);
      });
      tl.to(".fc .tack", { opacity: 0, duration: 0.2 }, 3.4);
      tl.fromTo("#f6-capB .w", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.14 }, 3.7);
      tl.fromTo("#f6-chipB", { scale: 0, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.36, ease: "back.out(1.8)" }, 3.98);
      tl.fromTo("#f6-subB", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 4.2);
      tl.fromTo("#f6-env", { y: 820 }, { y: 0, duration: 0.55, ease: "expo.out" }, 3.6);
      tl.fromTo("#f6-letter", { y: 640 }, { y: 0, duration: 0.7, ease: "power3.out" }, 3.95);
      tl.fromTo("#f6-letter", { rotation: 0 }, { rotation: -2.5, duration: 0.5, ease: "power2.out" }, 4.4);
      tl.fromTo("#f6-h1", { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.32, ease: "power2.inOut" }, 4.7);
      tl.fromTo("#f6-h2", { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.28, ease: "power2.inOut" }, 4.98);
      tl.fromTo("#f6-sp", { strokeDasharray: 400, strokeDashoffset: 400 }, { strokeDashoffset: 0, duration: 0.42, ease: "power1.inOut" }, 5.1);
      tl.fromTo("#f6-seal", { scale: 0, rotation: -40 }, { scale: 1, rotation: -8, duration: 0.4, ease: "back.out(2.2)" }, 5.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["s6"] = tl;
    })();
